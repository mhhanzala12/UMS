name: Tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

# Avoid stacking obsolete runs when several small fixes are pushed in sequence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Install Qt runtime for QML checks
        run: python -m pip install "PySide6>=6.7"
      - name: Verify Qt/QML imports
        run: python -c "from PySide6.QtCore import QUrl; from PySide6.QtGui import QGuiApplication; from PySide6.QtQml import QQmlComponent, QQmlEngine"
      - name: Compile Python sources
        run: python -m compileall -q ums legacy_app.py app.py tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
